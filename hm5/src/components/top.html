  <script>
    const API_BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://neuroflow.world';
    let projects = [];
    const MIN_VOTES = 1; // Minimum votes required to be listed
    const themeColors = {
      'Medicine': 'red',
      'Biology': 'limegreen',
      'Ecology': 'green',
      'Energy': 'orange',
      'Education': 'blue',
      'Industry': 'gray',
      'Transport': 'darkblue',
      'Agrotechnology': 'olive',
      'Artificial Intelligence': 'purple',
      'Cybersecurity': 'teal',
      'Urban Studies': 'brown',
      'Astronomy': 'navy',
      'Economics': 'gold',
      'Law': 'crimson',
      'Psychology': 'magenta',
      'Architecture': 'coral',
      'Sociology': 'lightblue',
      'Climatology': 'cyan',
      'Geology': 'sienna',
      'Physics': 'violet',
      'Chemistry': 'lime',
      'Biotechnology': 'forestgreen',
      'Cosmonautics': 'darkviolet',
      'Robotics': 'steelblue',
      'Environmental Protection': 'darkgreen',
      'Tourism': 'pink',
      'Food Technology': 'chocolate',
      'Logistics': 'darkgray',
      'Journalism': 'salmon',
      'Art': 'hotpink',
      'History': 'tan',
      'Anthropology': 'lightcoral',
      'Marketing': 'turquoise',
      'Finance': 'goldenrod',
      'Management': 'slateblue',
      'Aviation': 'skyblue',
      'Maritime Technology': 'deepskyblue',
      'Engineering': 'darkorange',
      'Information Technology': 'indigo',
      'Civil Sector': 'lightgreen',
      'Volunteering': 'lightpink',
      'Community Development': 'plum',
      'Humanitarian Aid': 'maroon',
      'Public Health': 'tomato',
      'Cultural Heritage': 'khaki',
      'Other': 'gray'
    };

    function setStatus(message, isError = true) {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = message;
      statusDiv.className = `bg-${isError ? 'red' : 'green'}-100 border border-${isError ? 'red' : 'green'}-400 text-${isError ? 'red' : 'green'}-700 px-4 py-3 rounded mb-4`;
      statusDiv.classList.remove('hidden');
      setTimeout(() => statusDiv.classList.add('hidden'), 3000);
    }

    function sanitizeInput(str) {
      if (!str) return '';
      const safeStr = String(str);
      return safeStr
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '\"')
        .replace(/'/g, '\'')
        .replace(/`/g, '`')
        .replace(/\(/g, '(')
        .replace(/\)/g, ')');
    }

    async function loadProjects() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/projects`, {
          credentials: 'include'
        });
        if (!response.ok) throw new Error(`Failed to load projects: ${response.status}`);
        projects = await response.json();

        // Fetch ratings for each project
        for (let project of projects) {
          try {
            const ratingsResponse = await fetch(`${API_BASE_URL}/api/projects/${project.id}/ratings`, {
              credentials: 'include'
            });
            if (ratingsResponse.ok) {
              const ratingsData = await ratingsResponse.json();
              project.ratings = Array.isArray(ratingsData.ratings) ? ratingsData.ratings : [];
              project.averageRating = ratingsData.average != null && !isNaN(ratingsData.average)
                ? parseFloat(ratingsData.average)
                : project.ratings.length
                  ? project.ratings.reduce((sum, r) => sum + r.rating, 0) / project.ratings.length
                  : 0;
              project.ratingCount = ratingsData.count != null && !isNaN(ratingsData.count)
                ? parseInt(ratingsData.count)
                : project.ratings.length;
            } else {
              project.ratings = Array.isArray(project.ratings) ? project.ratings : [];
              project.averageRating = project.ratings.length
                ? project.ratings.reduce((sum, r) => sum + r.rating, 0) / project.ratings.length
                : 0;
              project.ratingCount = project.ratings.length;
            }
          } catch (error) {
            console.error(`Error fetching ratings for project ${project.id}:`, error);
            project.ratings = Array.isArray(project.ratings) ? project.ratings : [];
            project.averageRating = project.ratings.length
              ? project.ratings.reduce((sum, r) => sum + r.rating, 0) / project.ratings.length
              : 0;
            project.ratingCount = project.ratings.length;
          }
        }

        // Calculate IMDb weighted ratings
        const validProjects = projects.filter(p => p.ratingCount >= MIN_VOTES);
        const meanRating = validProjects.length
          ? validProjects.reduce((sum, p) => sum + parseFloat(p.averageRating), 0) / validProjects.length
          : 5.0; // Default mean if no projects qualify

        projects = projects.map(project => {
          const themeMap = {
            'ecology': 'Ecology',
            'education': 'Education',
            'medicine': 'Medicine',
            'community': 'Community Development',
            'technology': 'Information Technology',
            'culture': 'Cultural Heritage',
            'humanitarian': 'Humanitarian Aid'
          };
          const category = themeMap[project.theme.toLowerCase()] || project.theme || 'Other';
          let weightedRating = project.averageRating;
          if (project.ratingCount >= MIN_VOTES) {
            const v = project.ratingCount;
            const R = parseFloat(project.averageRating);
            const C = meanRating;
            const m = MIN_VOTES;
            weightedRating = (v / (v + m)) * R + (m / (v + m)) * C;
          } else {
            weightedRating = 0; // Projects with insufficient votes get a weighted rating of 0
          }
          return {
            ...project,
            category,
            weightedRating: weightedRating.toFixed(2),
            image: project.image || 'https://via.placeholder.com/150'
          };
        });

        // Sort by weighted rating descending
        projects.sort((a, b) => parseFloat(b.weightedRating) - parseFloat(a.weightedRating));

        updateProjectList();
      } catch (error) {
        console.error('Error loading projects:', error);
        setStatus('Failed to load projects');
      }
    }

    function updateProjectList() {
      const projectList = document.getElementById('projectList');
      projectList.innerHTML = '';
      const topProjects = projects.filter(p => parseFloat(p.weightedRating) > 0);
      if (topProjects.length === 0) {
        projectList.innerHTML = '<p class="text-gray-600 text-center">No projects have enough ratings to be ranked yet.</p>';
        return;
      }
      topProjects.forEach((project, index) => {
        const dotColor = themeColors[project.category] || 'gray';
        const card = document.createElement('div');
        card.className = 'project-card flex items-start';
        card.innerHTML = `
          <div class="w-12 text-center text-xl font-bold text-gray-800 mr-4">${index + 1}</div>
          <img src="${sanitizeInput(project.image)}" alt="${sanitizeInput(project.title)}" class="w-24 h-24 object-cover rounded-md mr-4">
          <div class="flex-1">
            <div class="flex items-center">
              <span class="dot" style="background-color: ${dotColor};"></span>
              <h4 class="text-md font-medium text-gray-800">${sanitizeInput(project.title)}</h4>
            </div>
            <p class="text-gray-600">${sanitizeInput(project.description)}</p>
            <p class="text-gray-500 text-sm"><span class="font-medium">Theme:</span> ${sanitizeInput(project.category)}</p>
            <p class="text-gray-500 text-sm"><span class="font-medium">Event Type:</span> ${sanitizeInput(project.eventType)}</p>
            <p class="text-gray-500 text-sm"><span class="font-medium">Location:</span> ${sanitizeInput(project.location)}, ${sanitizeInput(project.country)}</p>
            <p class="text-gray-500 text-sm"><span class="font-medium">Weighted Rating:</span> ${project.weightedRating}</p>
            <p class="text-gray-500 text-sm"><span class="font-medium">Average Rating:</span> ${project.averageRating} (${project.ratingCount} votes)</p>
            <div class="flex items-center mt-2">
              ${Array.from({ length: Math.round(project.averageRating) }, () => '<span class="star">★</span>').join('')}
            </div>
            <div class="flex flex-wrap gap-2 mt-2">
              <button class="details-btn bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-600" data-project-id="${project.id}">Details</button>
              <button class="check-btn bg-purple-500 text-white py-1 px-3 rounded hover:bg-purple-600" data-project-id="${project.id}">Check</button>
              <button class="contact-btn bg-green-500 text-white py-1 px-3 rounded hover:bg-green-600" data-author-email="${sanitizeInput(project.authorEmail)}">Contact</button>
            </div>
          </div>
        `;
        projectList.appendChild(card);
      });
      document.querySelectorAll('.details-btn').forEach(btn => btn.onclick = () => {
        const projectId = parseInt(btn.dataset.projectId);
        showJoinProjectModal(projectId);
      });
      document.querySelectorAll('.check-btn').forEach(btn => btn.onclick = () => {
        const projectId = parseInt(btn.dataset.projectId);
        const project = projects.find(p => p.id === projectId);
        const functionName = project ? project.functionName : '';
        if (functionName && functionName.trim() !== '') {
          try {
            launchApp(functionName);
          } catch (error) {
            setStatus('Не вдалося запустити додаток');
          }
        } else {
          setStatus('Для цього проєкту немає додатку');
        }
      });
      document.querySelectorAll('.contact-btn').forEach(btn => btn.onclick = () => {
        const authorEmail = btn.dataset.authorEmail;
        const iframe = document.getElementById('contactIframe');
        iframe.src = `https://neuroflow.world/p2p?searchEmail=${encodeURIComponent(authorEmail)}`;
        document.getElementById('contactModal').classList.remove('hidden');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProjects();
    });

    // Header functionality
    document.addEventListener('DOMContentLoaded', function() {
      // Profile modal
      const profileBtn = document.querySelector('.pfc-profile-btn');
      const profileOverlay = document.querySelector('.pfc-profile-overlay');
      const profileModal = document.querySelector('.pfc-profile-modal');
      const closeProfileBtn = document.querySelector('.pfc-close-profile');

      if (profileBtn && profileOverlay && profileModal && closeProfileBtn) {
        profileBtn.addEventListener('click', () => {
          profileOverlay.classList.add('pfc-active');
          profileModal.classList.add('pfc-active');
        });

        closeProfileBtn.addEventListener('click', () => {
          profileOverlay.classList.remove('pfc-active');
          profileModal.classList.remove('pfc-active');
        });

        profileOverlay.addEventListener('click', () => {
          profileOverlay.classList.remove('pfc-active');
          profileModal.classList.remove('pfc-active');
        });
      }

      // Mobile menu
      const menuBtn = document.querySelector('.pfc-menu-btn');
      const navMenu = document.querySelector('.pfc-navmenu');

      if (menuBtn && navMenu) {
        menuBtn.addEventListener('click', () => {
          navMenu.classList.toggle('pfc-active');
        });
      }

      // Login button
      const loginBtn = document.querySelector('.pfc-login-container');
      if (loginBtn) {
        loginBtn.addEventListener('click', () => {
          // Add your login logic here
          console.log('Login clicked');
        });
      }

      // Manager functionality
      const filterItems = document.querySelectorAll('.filter-item');
      const clearFiltersBtn = document.querySelector('.pfc-clear-filters');
      const searchInput = document.querySelector('.pfc-search-input');

      // Filter items selection
      filterItems.forEach(item => {
        item.addEventListener('click', () => {
          item.classList.toggle('selected');
          updateFilters();
        });
      });

      // Clear filters
      if (clearFiltersBtn) {
        clearFiltersBtn.addEventListener('click', () => {
          filterItems.forEach(item => {
            item.classList.remove('selected');
          });
          if (searchInput) {
            searchInput.value = '';
          }
          updateFilters();
        });
      }

      // Search functionality
      if (searchInput) {
        searchInput.addEventListener('input', debounce(() => {
          updateFilters();
        }, 300));
      }

      // Update filters function
      function updateFilters() {
        const selectedCountries = Array.from(document.querySelectorAll('.pfc-countries .filter-item.selected'))
          .map(item => item.textContent.trim());
        
        const selectedThemes = Array.from(document.querySelectorAll('.pfc-themes .filter-item.selected'))
          .map(item => item.textContent.trim());
        
        const selectedTypes = Array.from(document.querySelectorAll('.pfc-types .filter-item.selected'))
          .map(item => item.textContent.trim());
        
        const searchQuery = searchInput ? searchInput.value.trim() : '';

        // Here you can implement the filtering logic
        console.log('Selected countries:', selectedCountries);
        console.log('Selected themes:', selectedThemes);
        console.log('Selected types:', selectedTypes);
        console.log('Search query:', searchQuery);

        // Add your filtering logic here
      }

      // Debounce function for search input
      function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
          const later = () => {
            clearTimeout(timeout);
            func(...args);
          };
          clearTimeout(timeout);
          timeout = setTimeout(later, wait);
        };
      }
    });

    function showJoinProjectModal(projectId) {
      const project = projects.find(p => p.id === projectId);
      if (!project) return;
      const modal = document.getElementById('joinProjectModal');
      const title = document.getElementById('joinProjectTitle');
      const content = document.getElementById('joinProjectContent');
      title.textContent = `Проєкт: "${sanitizeInput(project.title)}"`;
      content.innerHTML = `
        <p><strong>Опис:</strong> ${sanitizeInput(project.description)}</p>
        <p><strong>Тема:</strong> ${sanitizeInput(project.category)}</p>
        <p><strong>Тип події:</strong> ${sanitizeInput(project.eventType)}</p>
        <p><strong>Статус:</strong> ${sanitizeInput(project.status)}</p>
        <p><strong>Мета:</strong> ${sanitizeInput(project.goal) || 'Не вказано'}</p>
        <p><strong>Function Name:</strong> ${sanitizeInput(project.functionName) || 'None'}</p>
        <p><strong>Локація:</strong> ${sanitizeInput(project.location)}, ${sanitizeInput(project.country)}</p>
        <p><strong>Контакт:</strong> <a href="mailto:${sanitizeInput(project.contact)}" class="text-blue-500 hover:underline">${sanitizeInput(project.contact)}</a></p>
        <p><strong>Рейтинг:</strong> ${project.averageRating} (${project.ratingCount} голосів)</p>
        <p class="mt-4"><strong>Як приєднатися:</strong> Напишіть на контактну пошту для деталей участі.</p>
      `;
      modal.classList.remove('hidden');
    }
    function closeJoinProjectModal() {
      document.getElementById('joinProjectModal').classList.add('hidden');
    }
    function launchApp(name) {
      document.querySelector('.container').style.display = 'none';
      const iframe = document.createElement('iframe');
      iframe.className = 'fullscreen-iframe';
      iframe.src = `../aplication/projects/${name}/index.html`;
      const closeButton = document.createElement('button');
      closeButton.className = 'close-fullscreen';
      closeButton.innerHTML = '✕';
      closeButton.onclick = () => {
        iframe.remove();
        closeButton.remove();
        document.querySelector('.container').style.display = 'block';
      };
      document.body.appendChild(iframe);
      document.body.appendChild(closeButton);
    }
    function closeContactModal() {
      document.getElementById('contactModal').classList.add('hidden');
      document.getElementById('contactIframe').src = '';
    }
    document.getElementById('closeJoinModal').onclick = closeJoinProjectModal;
    document.getElementById('closeContactModal').onclick = closeContactModal;
  </script>
